name: CI
on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_PUBLIC_SITE_URL: https://example.com
      - run: npm run check
      - run: npm run check:bundle
      - run: npm run lighthouse
